<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 외부 리소스를 일절 쓰지 않는다. 전부 로컬 파일 + 코드로 그린 도트. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Team View</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bar">
      <button id="pick">프로젝트 선택</button>
      <span id="project">(선택 안 됨)</span>
      <span id="status" class="warn">시작 중…</span>
    </div>

    <main>
      <section id="left">
        <div id="stage-wrap">
          <canvas id="stage"></canvas>
          <!-- 이름표·말풍선은 캔버스가 아니라 DOM으로 올린다.
               도트 배율(2~4배)에 묶이면 글자가 읽히지 않기 때문이다. -->
          <div id="overlay"></div>
        </div>
      </section>

      <!-- 채팅: 전체 지시와 팀원별 대화를 한곳에서 -->
      <aside id="chat">
        <header>
          <div id="targets"></div>
        </header>
        <div id="messages"></div>
        <footer>
          <textarea
            id="chat-input"
            rows="2"
            placeholder="지시를 입력하세요. Enter 전송 · Shift+Enter 줄바꿈"
          ></textarea>
          <div class="send-row">
            <label title="켜면 새 Claude Code 프로세스를 띄워 즉시 실행합니다. 끄면 지금 열려 있는 세션이 다음 턴에 받습니다.">
              <input type="checkbox" id="chat-spawn" />
              새 세션으로 즉시 실행
            </label>
            <button id="chat-send">보내기</button>
          </div>
          <p id="chat-hint"></p>
        </footer>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
