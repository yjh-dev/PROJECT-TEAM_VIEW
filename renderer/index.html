<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 외부 리소스를 일절 쓰지 않는다. 전부 로컬 파일 + 코드로 그린 도트. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Team View</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bar">
      <button id="pick">프로젝트 선택</button>
      <span id="project">(선택 안 됨)</span>
      <span id="status" class="warn">시작 중…</span>
    </div>

    <main>
      <div id="stage-wrap">
        <canvas id="stage"></canvas>
        <!-- 이름표·말풍선은 캔버스가 아니라 DOM으로 올린다.
             도트 배율(2~4배)에 묶이면 글자가 읽히지 않기 때문이다. -->
        <div id="overlay"></div>

        <!-- 캐릭터를 클릭하면 열리는 개별 지시 패널 -->
        <aside id="panel" hidden>
          <header>
            <strong id="panel-name">팀원</strong>
            <button id="panel-close" title="닫기 (Esc)">✕</button>
          </header>
          <textarea
            id="panel-input"
            rows="3"
            placeholder="이 팀원에게 시킬 일을 적으세요. Enter로 전송, Shift+Enter 줄바꿈."
          ></textarea>
          <div class="row">
            <label title="켜면 새 Claude Code 프로세스를 띄워 즉시 실행합니다. 끄면 대기열에만 넣습니다.">
              <input type="checkbox" id="panel-spawn" />
              새 세션으로 즉시 실행
            </label>
            <button id="panel-send">보내기</button>
          </div>
          <p id="panel-hint"></p>
        </aside>
      </div>
      <pre id="log" aria-label="최근 활동"></pre>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
