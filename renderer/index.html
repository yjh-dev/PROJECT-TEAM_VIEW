<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 외부 리소스를 일절 쓰지 않는다. 전부 로컬 파일 + 코드로 그린 도트. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Team View</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 실행 환경 배너 — claude가 없거나 로그인이 안 됐거나 Figma가 끊겨 있을 때만 뜬다.
         팀뷰는 Claude Code 위에서 도는 앱이라 이게 없으면 아무것도 일어나지 않는다. -->
    <!-- 설치 안내 — 이 컴퓨터에 필요한 프로그램이 없을 때만 뜬다.
         앱만 복사해 온 PC에서는 화면은 떠도 아무 일도 일어나지 않는데, 무엇이 없어서인지
         알 방법이 없다. 그래서 시작할 때 먼저 확인하고 **동의를 받아** 설치를 돕는다. -->
    <div id="need" hidden>
      <div class="need-head">
        <strong>팀뷰를 쓰려면 이 프로그램들이 필요합니다</strong>
        <button id="need-close" type="button" title="닫기 (상단 상태 점에서 다시 확인할 수 있습니다)">×</button>
      </div>
      <div id="need-list"></div>
      <p class="need-foot">
        설치는 <b>동의를 누른 뒤에만</b> 진행됩니다. 앱이 설치 파일을 대신 내려받아 실행하지 않고,
        명령을 새 창에 띄우거나 공식 다운로드 페이지를 열어 줍니다.
      </p>
    </div>

    <div id="env" hidden>
      <span id="env-msg"></span>
      <button id="env-act" type="button"></button>
      <button id="env-again" type="button" title="상태를 다시 확인합니다">다시 확인</button>
    </div>

    <div id="bar">
      <!-- 프로젝트 탭. 사무실은 한 번에 하나만 보여 주지만 **나머지도 계속 일한다** —
           그래서 탭마다 상태 배지(처리 중 / 대기 N건 / 닫힘)를 달아 둔다. -->
      <div id="tabs"></div>
      <button id="add" title="프로젝트를 하나 더 붙입니다 (최대 3개)">+ 프로젝트</button>
      <!-- 구성이 빠졌을 때만 나타난다. 붙일 때 거절했거나 나중에 갖추고 싶을 때의 자리. -->
      <button id="setup" hidden title="빠진 구성(훅·팀원·CLAUDE.md)을 채웁니다">세팅하기</button>
      <span id="status" class="warn">시작 중…</span>
      <!-- 지금 일하는 사람을 한 줄로. 캐릭터를 일일이 쫓지 않아도 보이게. -->
      <span id="now"></span>
      <!-- 연결 상태 — 문제가 없을 때도 항상 보인다. 배너는 문제가 있을 때만 뜨는데,
           그러면 "지금 연결돼 있다"는 확인을 할 방법이 없다. -->
      <span id="conn"></span>
    </div>

    <main>
      <section id="left">
        <div id="stage-wrap">
          <canvas id="stage"></canvas>
          <!-- 이름표·말풍선은 캔버스가 아니라 DOM으로 올린다.
               도트 배율(2~4배)에 묶이면 글자가 읽히지 않기 때문이다. -->
          <div id="overlay"></div>

          <!-- 붙인 프로젝트가 없을 때만. 화면에서 가장 큰 자리(사무실)가 처음 열었을 때
               가장 쓸모없는 상태였다 — 할 일은 구석에 작게 세 군데로 흩어져 있었다. -->
          <div id="welcome" hidden>
            <h2>작업할 폴더를 붙이면 팀이 움직입니다</h2>
            <p>
              폴더를 고르면 훅·팀원 10명·CLAUDE.md를 앱이 갖춰 줍니다(동의를 받고).
              그다음 오른쪽에 지시를 적으면 리드가 담당을 정해 일을 시작합니다.
            </p>
            <button id="welcome-add" type="button">폴더 고르기</button>
            <p class="hint">
              화면은 드래그로 옮기고 <b>Ctrl</b>+휠로 확대합니다 · <b>Ctrl</b>+<b>0</b>이면 처음 크기
            </p>
          </div>
        </div>
      </section>

      <!-- 채팅: 전체 지시와 팀원별 대화를 한곳에서 -->
      <aside id="chat">
        <header>
          <!-- 도구 버튼을 칩과 같은 줄에 두면 칩이 밀려 한 줄 더 차지한다.
               위아래로 나눠 칩이 패널 폭을 온전히 쓰게 한다. -->
          <div class="chat-tools">
            <!-- 대화와 결과물. 한 시간짜리 작업이 끝나고 "뭐가 만들어졌나"를 보려면
                 도구 로그 100줄을 거슬러 올라가야 했다. 결과만 따로 모아 둔다. -->
            <div class="panel-tabs" role="tablist">
              <button id="tab-chat" type="button" class="sel" role="tab" aria-selected="true">대화</button>
              <button id="tab-out" type="button" role="tab" aria-selected="false" title="팀이 만들거나 고친 파일과 Figma 링크">
                결과물<span id="out-count" hidden></span>
              </button>
            </div>
            <!-- 도구 활동은 한 작업에 100줄이 넘어 지시·답변을 묻어 버린다.
                 지우지는 않고 접을 수 있게 둔다 — 상세를 봐야 할 때가 있다. -->
            <button id="toggle-tools" type="button" class="on" title="파일 읽기·명령 실행 같은 도구 활동을 접거나 폅니다">
              도구 활동
            </button>
            <button id="copy-all" type="button" title="대화 전체를 클립보드로">전체 복사</button>
          </div>
          <!-- 이 프로젝트가 무엇으로 만들어져 있는지. 며칠 만에 다시 열면
               무슨 스택이었는지 기억나지 않는다. 실제 파일에서 읽어 낸다. -->
          <div id="stack" hidden></div>
          <div id="targets"></div>
        </header>
        <div id="messages"></div>
        <!-- 결과물 — 지시 한 건마다 그때 만들어지거나 고쳐진 파일과 Figma 링크를 묶는다.
             파일을 누르면 탐색기에서 그 파일이 선택된 채로 열린다. -->
        <div id="outputs" hidden></div>
        <footer>
          <textarea
            id="chat-input"
            rows="2"
            placeholder="지시를 입력하세요. Enter 전송 · Shift+Enter 줄바꿈"
          ></textarea>
          <div class="send-row">
            <!-- 지시는 언제나 회사가 받는다. 고를 것이 없으므로 체크박스도 없다. -->
            <button id="chat-cancel" type="button" title="대기 중인 지시를 버리고, 회사가 띄운 실행을 중단합니다">
              작업 취소
            </button>
            <button id="chat-send">보내기</button>
          </div>
          <p id="chat-hint"></p>
        </footer>
      </aside>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
